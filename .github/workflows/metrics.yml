name: Metrics
on:
  # Обновление раз в сутки
  schedule: [{cron: "0 0 * * *"}]
  # Возможность запустить вручную
  workflow_dispatch:
  # Запуск при пуше в main
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: 
      name: production
    permissions:
      contents: write
    steps:
      # Шаг 1: Базовые метрики
      - name: Base metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Xellor-Dev
          template: classic
          base: header, community, repositories, metadata
          config_timezone: Europe/Warsaw

      # Шаг 2: Календарь за весь год
      - name: Full-year calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.isocalendar.fullyear.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Europe/Warsaw
