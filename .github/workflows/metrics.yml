name: Metrics
on:
  # Обновление раз в сутки
  schedule: [{cron: "0 0 * * *"}]
  # Возможность запустить вручную
  workflow_dispatch:
  # Запуск при пуше в main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: 
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Тот самый секрет, который мы создали
          token: ${{ secrets.METRICS_TOKEN }}

          # Базовые настройки
          user: Xellor-Dev
          template: classic
          base: header, community, repositories, metadata
          config_timezone: Europe/Warsaw

          name: Full-year calendar
          uses: lowlighter/metrics@latest
          with:
            filename: metrics.plugin.isocalendar.fullyear.svg
            token: ${{ secrets.METRICS_TOKEN }}
            base: ""
            plugin_isocalendar: yes
            plugin_isocalendar_duration: full-year
